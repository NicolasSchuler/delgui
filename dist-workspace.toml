[workspace]
members = ["cargo:."]

# Config for 'dist'. Regenerate .github/workflows/release.yml after any change
# here with `dist generate`; the workflow is generated, not hand-edited.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
# Empty while the repository is private, and that is a constraint rather than a
# preference. Both the shell installer and a Homebrew formula fetch
# `releases/download/...` anonymously, which a private repo refuses; brew has no
# way to authenticate for it at all (axodotdev/cargo-dist#2267 is open and
# unimplemented). They would build fine and then fail for every user, so they
# are off until the repo is public. RELEASING.md records how to switch them on.
installers = []
# No x86_64-pc-windows-msvc, which `dist init` offers by default: panel buffers
# reach delta as /dev/fd/N pipes and the subprocess teardown kills a process
# group, both of which are #[cfg(unix)]. Windows would not build, and a target
# that cannot work has no business in a release matrix.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
install-path = "CARGO_HOME"
install-updater = false
