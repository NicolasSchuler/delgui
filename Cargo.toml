[workspace]
resolver = "3"
members = ["crates/delgui-core", "crates/delgui"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/NicolasSchuler/delgui"
homepage = "https://github.com/NicolasSchuler/delgui"
authors = ["Nicolas Schuler"]
# egui and eframe 0.36 require Rust 1.95, which sets the workspace's build floor.
rust-version = "1.95"

[workspace.dependencies]
delgui-core = { path = "crates/delgui-core" }
anstyle-parse = "1.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
